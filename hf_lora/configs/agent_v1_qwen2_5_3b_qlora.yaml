model:
  name: Qwen/Qwen2.5-3B-Instruct
  dtype: float16
  quantization: 4bit
  max_length: 640

lora:
  rank: 8
  alpha: 16
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]

training:
  seed: 20260825
  micro_batch_size: 1
  gradient_accumulation_steps: 4
  max_optimizer_steps: 80
  learning_rate: 0.00015
  weight_decay: 0.0
  warmup_steps: 5
  minimum_lr_ratio: 0.1
  max_grad_norm: 1.0
  eval_interval: 40
  scaler_initial_scale: 256

paths:
  train_data: hf_lora/data/agent_v1/train.jsonl
  validation_data: hf_lora/data/agent_v1/validation.jsonl
  artifact_directory: hf_lora/artifacts/agent_v1_1_qwen2_5_3b_qlora

generation:
  max_new_tokens: 96
  prompts:
    - category: calculator_tool_call
      system: 需要工具时，只输出 {"tool_call":{"name":"tool_name","arguments":{}}} 格式的 JSON。
      user: 请用计算器精确计算 913 乘以 47。
    - category: retrieval_tool_call
      system: 需要工具时，只输出 {"tool_call":{"name":"tool_name","arguments":{}}} 格式的 JSON。
      user: 请查内部资料：星屿项目9999由哪个团队负责？
    - category: direct_answer
      system: 可以直接回答时不要调用工具。
      user: 面试中怎样简洁说明数据污染？
