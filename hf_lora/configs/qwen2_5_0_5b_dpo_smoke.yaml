model:
  name: Qwen/Qwen2.5-0.5B-Instruct
  dtype: bfloat16
  quantization: 4bit
  max_length: 128

lora:
  rank: 4
  alpha: 8
  dropout: 0.0
  target_modules: [q_proj, v_proj]

dpo:
  beta: 0.1
  learning_rate: 0.000005
  weight_decay: 0.0
  max_optimizer_steps: 2
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  warmup_steps: 0
  minimum_lr_ratio: 0.1
  micro_batch_size: 1
  seed: 42

paths:
  train_data: hf_lora/data/preferences/train.jsonl
  validation_data: hf_lora/data/preferences/validation.jsonl
  artifact_directory: output/dpo_smoke
