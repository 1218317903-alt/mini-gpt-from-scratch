[project]
name = "mini-gpt-from-scratch"
version = "0.1.0"
description = "A tested decoder-only MiniGPT and Hugging Face LoRA learning project."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pyyaml>=6.0.2,<7",
    "torch>=2.6,<3",
]

[project.optional-dependencies]
dev = [
    "mypy==2.3.1",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<8",
    "ruff==0.16.3",
    "types-PyYAML>=6.0.12,<7",
]
hf = [
    "accelerate>=1,<2",
    "datasets>=3,<5",
    "peft>=0.15,<1",
    "safetensors>=0.5,<1",
    "transformers>=4.49,<6",
]
viz = ["matplotlib>=3.9,<4"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "hf_lora/src"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
pythonpath = [".", "src", "hf_lora/src"]
testpaths = ["tests", "hf_lora/tests"]
markers = [
    "integration: requires the locally cached Hugging Face model",
]

[tool.coverage.run]
source = ["minigpt", "hf_lora"]
branch = true

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
files = [
    "src",
    "hf_lora/src",
    "train.py",
    "evaluate.py",
    "generate.py",
    "scripts",
]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["matplotlib", "matplotlib.*"]
ignore_missing_imports = true
